<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>forestpolls</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f1;--card:#fefdf8;--ink:#1a3f2e;--mut:#6b7f72;--sage:#9cb98f;--line:#dfe6da;--tint:#e6eddf;--nav:#1a3f2e;--navtxt:#f7f7f1;--btn:#1a3f2e;--btntxt:#fff;--bad:#b84a4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1d16;--card:#16271e;--ink:#e6efe3;--mut:#9fb3a5;--sage:#9cb98f;--line:#27402f;--tint:#1f3528;--nav:#0a140f;--navtxt:#e6efe3;--btn:#9cb98f;--btntxt:#0f1d16;--bad:#e08a8a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1d16;--card:#16271e;--ink:#e6efe3;--mut:#9fb3a5;--sage:#9cb98f;--line:#27402f;--tint:#1f3528;--nav:#0a140f;--navtxt:#e6efe3;--btn:#9cb98f;--btntxt:#0f1d16;--bad:#e08a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.serif,h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:400;margin:0}
nav{background:var(--nav);color:var(--navtxt);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav .in{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.logo{font-family:Fraunces,Georgia,serif;font-size:22px;display:flex;align-items:center;gap:10px}
.logo b{font-weight:600}.logo span{color:var(--sage)}
.mark{width:34px;height:34px;border-radius:10px;background:var(--tint);color:var(--ink);display:grid;place-items:center}
.tabs{display:flex;gap:6px}
.tabs button,.pill{background:none;border:0;color:var(--navtxt);font:inherit;padding:8px 14px;border-radius:10px;cursor:pointer}
.tabs button.on{background:rgba(255,255,255,.12)}
.pill{border:1px solid rgba(255,255,255,.3)}
main{max-width:1100px;margin:auto;padding:40px 20px 60px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--mut)}
h1{font-size:clamp(38px,7vw,68px);line-height:1.05;margin:14px 0 18px}
h1 em{color:var(--sage)}
.lead{color:var(--mut);max-width:520px;font-size:18px}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;margin-top:40px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px}
.dark{background:linear-gradient(135deg,#1a3f2e,#4f7c58);color:#f4f7ef;border:0}
label{display:block;font-weight:600;margin:20px 0 8px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
input:focus,select:focus{outline:2px solid var(--sage)}
.opt{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.num{flex:none;width:44px;height:44px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-weight:600;font-size:13px}
.btn{width:100%;margin-top:24px;background:var(--btn);color:var(--btntxt);border:0;border-radius:14px;padding:18px;font:inherit;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;padding:0}
.err{color:var(--bad);font-size:14px;margin-top:12px;min-height:20px}
.steps .num{width:38px;height:38px}.step{display:flex;gap:14px;margin-top:18px}
.step p{margin:0;color:var(--mut);font-size:14px}
.polls{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
@media(max-width:800px){.polls{grid-template-columns:1fr}}
.cat{font-size:14px;color:var(--mut)}
.q{font-family:Fraunces,Georgia,serif;font-size:26px;margin:10px 0 6px}
.bar{position:relative;display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:8px;overflow:hidden;cursor:pointer}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--tint);z-index:0;transition:width .4s}
.bar span{position:relative;z-index:1}
.bar.mine{border-color:var(--sage);font-weight:600}
.del{margin-top:14px;background:none;border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:end;margin-top:50px;border-bottom:1px solid var(--line);padding-bottom:16px}
.note{color:var(--mut);margin-top:20px}
</style></head><body>
<nav><div class="in">
<div class="logo"><div class="mark">✳</div><span style="color:var(--navtxt)"><b>forest</b><span>polls</span></span></div>
<div class="tabs"><button id="t-create">Create a poll</button><button id="t-explore">Explore polls</button></div>
<button class="pill" id="t-new">New poll +</button>
</div></nav>
<main id="app"></main>
<script>
const CATS=["Campus life","Academics","Food","Events","Sports","Other"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db=null,uid="guest",polls=[],votes=[],view="create",unsub=[],notice="";
const local={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function nav(v){view=v;$("#t-create").classList.toggle("on",v==="create");$("#t-explore").classList.toggle("on",v==="explore");render();scrollTo(0,0)}
$("#t-create").onclick=$("#t-new").onclick=()=>nav("create");
$("#t-explore").onclick=()=>nav("explore");

function renderCreate(){
$("#app").innerHTML=`
<div class="eyebrow">Your community, your voice</div>
<h1>Good ideas grow<br>when <em>everyone</em> is heard.</h1>
<p class="lead">Create a poll, gather opinions, and make your next class decision together.</p>
<div class="grid">
<div class="card"><div class="eyebrow">Let’s get started</div><h2 style="font-size:36px;margin:8px 0">Create a poll</h2>
<p style="color:var(--mut);margin:0">A question is all it takes to get the conversation going.</p>
<label for="q">Poll question *</label><input id="q" maxlength="140" placeholder="What should we decide together?">
<label>Answer options * <span style="float:right;font-weight:400;color:var(--mut);font-size:14px">At least 2 options</span></label>
<div id="opts"></div>
<button class="link" id="add" type="button">＋ Add another option</button>
<label for="cat">Poll category</label><select id="cat">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
<div class="err" id="err"></div>
<button class="btn" id="go"><span>Create my poll</span><span>↗</span></button></div>
<div><div class="card dark"><div class="eyebrow" style="color:#cfe0c8">A little inspiration</div>
<h2 style="font-size:34px;margin:14px 0">Small questions.<br>Big conversations.</h2>
<p style="opacity:.85">From choosing a college event to sharing new ideas, let your community help shape what comes next.</p></div>
<div class="card steps" style="margin-top:24px"><h2 style="font-size:26px">How it works</h2>
<div class="step"><div class="num">01</div><div><b>Ask a question</b><p>Make it clear and easy to answer.</p></div></div>
<div class="step"><div class="num">02</div><div><b>Share your poll</b><p>Let your classmates join in.</p></div></div>
<div class="step"><div class="num">03</div><div><b>See what grows</b><p>Explore the results together.</p></div></div></div></div></div>
<div class="card" style="margin-top:30px;display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--tint)">
<div><b class="serif" style="font-size:22px">There is room for every opinion.</b><div style="color:var(--mut)">Ready to see what your community thinks?</div></div>
<button class="link" onclick="nav('explore')">Explore polls →</button></div>`;
const o=$("#opts");const addOpt=()=>{const n=o.children.length+1;if(n>8)return;const d=document.createElement("div");d.className="opt";d.innerHTML=`<div class="num">${String(n).padStart(2,"0")}</div><input maxlength="80" placeholder="${["First","Second","Third","Fourth","Fifth","Sixth","Seventh","Eighth"][n-1]} option">`;o.appendChild(d)};
addOpt();addOpt();$("#add").onclick=addOpt;$("#go").onclick=createPoll}

async function createPoll(){
const err=$("#err");err.textContent="";
const q=$("#q").value.trim();
const opts=[...document.querySelectorAll("#opts input")].map(i=>i.value.trim()).filter(Boolean);
const uniq=[...new Set(opts.map(s=>s.toLowerCase()))];
if(!q)return err.textContent="Please enter a poll question.";
if(opts.length<2)return err.textContent="Please add at least 2 answer options.";
if(uniq.length!==opts.length)return err.textContent="Answer options must be different from each other.";
if(!db)return err.textContent="Database unavailable. Please sign in to claude.ai and reload.";
const b=$("#go");b.disabled=true;
try{await db.collection("polls").add({question:q,options:opts,category:$("#cat").value,createdBy:uid,createdAt:Date.now()});
notice="Poll created!";nav("explore")}catch(e){err.textContent="Could not save: "+(e.message||"permission denied");b.disabled=false}}

function tally(p){const c=p.options.map(()=>0);votes.filter(v=>v.pollId===p.id).forEach(v=>{if(c[v.choice]!==undefined)c[v.choice]++});return c}
function renderExplore(){
$("#app").innerHTML=`<div class="eyebrow">The community board</div>
<h1>Let’s see what<br><em>everyone thinks.</em></h1>
<p class="lead">Explore the questions your student community is asking. Cast your vote and see the results grow.</p>
<div class="row"><div><div class="eyebrow">The latest</div><h2 style="font-size:36px">Community polls</h2></div></div>
<div id="list"></div>`;paintList()}
function paintList(){
const l=$("#list");if(!l)return;
if(!db){l.innerHTML=`<p class="note">Sign in to claude.ai to load the shared poll database.</p>`;return}
if(!polls.length){l.innerHTML=`<p class="note">No polls yet. Be the first to <button class="link" onclick="nav('create')">create one</button>.</p>`;return}
l.innerHTML=`<div class="polls">${polls.map(p=>{const c=tally(p),t=c.reduce((a,b)=>a+b,0),my=votes.find(v=>v.pollId===p.id&&v.uid===uid);
return `<div class="card"><div class="cat">✱ ${esc(p.category||"Other")}</div><div class="q">${esc(p.question)}</div>
<div style="color:var(--mut);font-size:14px">${t} community vote${t===1?"":"s"}</div>
${p.options.map((o,i)=>`<button class="bar ${my&&my.choice===i?"mine":""}" data-p="${p.id}" data-i="${i}"><i style="width:${t?Math.round(c[i]/t*100):0}%"></i><span>${esc(o)}</span><span>${t?Math.round(c[i]/t*100):0}%</span></button>`).join("")}
${p.createdBy===uid?`<button class="del" data-del="${p.id}">Delete</button>`:""}</div>`}).join("")}</div>`;
l.querySelectorAll(".bar").forEach(b=>b.onclick=()=>vote(b.dataset.p,+b.dataset.i));
l.querySelectorAll(".del").forEach(b=>b.onclick=()=>delPoll(b.dataset.del))}
async function vote(pid,i){try{await db.collection("votes").doc(pid+"_"+uid).set({pollId:pid,uid,choice:i})}catch(e){alert("Could not record vote.")}}
async function delPoll(id){if(!confirm("Delete this poll?"))return;try{await db.collection("polls").doc(id).delete();
await Promise.all(votes.filter(v=>v.pollId===id).map(v=>db.collection("votes").doc(id+"_"+v.uid).delete().catch(()=>{})))}catch(e){alert("Could not delete.")}}
function render(){view==="create"?renderCreate():renderExplore()}

async function boot(){render();nav("create");
try{const user=await claude.use("user");uid=user?await user.id():"guest";db=await claude.use("db")}catch(e){db=null}
if(!db){paintList();return}
db.collection("polls").orderBy("createdAt","desc").onSnapshot(s=>{polls=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>Array.isArray(p.options)&&p.options.length>=2);if(view==="explore")paintList()});
db.collection("votes").onSnapshot(s=>{votes=s.docs.map(d=>d.data());if(view==="explore")paintList()})}
boot();
</script></body></html>
